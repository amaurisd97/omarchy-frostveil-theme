mode = "dark"

# Acento profundo azul-hielo. Lo usa omawrite para botones primarios con
# texto blanco fijo (≥4.5:1 con #ffffff); el shell mantiene el acento claro
# #6bcee5 en superficies de texto/borde via overrides de shell.toml.
accent = "#2c7190"
cursor = "#f0f4f6"
selection = "#2b4663"
selection_foreground = "#0e1114"
selection_background = "#6bcee5"

# Degradado del borde activo. Sin angulo = horizontal (izq->der).
# Rampa acero-gris: acero claro -> acero medio -> noche -> acero medio -> acero claro.
hyprland_active_border = "#8fa3b5 #3f5a70 #1a2736 #3f5a70 #8fa3b5"

background = "#0e1114"
foreground = "#e4edf2"

color0 = "#0e1114"
