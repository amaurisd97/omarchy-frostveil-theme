# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.
#
# Frostveil ships the look'n'feel used on the machine this theme was tuned on,
# so applying it reproduces that desktop. Colours mirror colors.toml; the active
# border uses the same fade-to-centre gradient (see hyprland_active_border).

# El borde activo replica el degradado de colors.toml
# (hyprland_active_border): acero claro que se apaga a noche en el centro.
$activeBorderColor = rgba(8fa3b5ee) rgba(3f5a70ee) rgba(1a2736ee) rgba(3f5a70ee) rgba(8fa3b5ee)
$group_border_active = rgba(8fa3b5ee) rgba(1a2736ee) 90deg
$group_border_inactive = rgba(2b4663ee) rgba(2b4663ee)
$group_locked_active = rgba(8fa3b5ee) rgba(1a2736ee) 90deg
$group_locked_inactive = rgba(2b4663ee) rgba(2b4663ee)
$text_active = rgba(e4edf2ee) rgba(e4edf2ee)
$text_inactive = rgba(e4edf2ee) rgba(e4edf2ee)
$groupbar_active = rgba(8fa3b5ee) rgba(8fa3b5ee)
$groupbar_inactive = rgba(5c646dee) rgba(5c646dee)
$groupbar_locked_active = rgba(6bcee5ee) rgba(6bcee5ee)
$groupbar_locked_inactive = rgba(5c646dee) rgba(5c646dee)
$shadow_inactive = rgba(0e1114ee) rgba(0e1114ee)
$shadow_color = rgba(00000052) rgba(00000052)
$background = rgba(0e1114ee) rgba(0e1114ee)



general {
    col.active_border = $activeBorderColor
    allow_tearing = true
}

group {
    col.border_active = $activeBorderColor
}
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = true
    layout = dwindle
}

group {
    col.border_active           = $group_border_active
    col.border_inactive         = $group_border_inactive
    col.border_locked_active    = $group_locked_active
    col.border_locked_inactive  = $group_locked_inactive
}

group:groupbar {
    enabled = true
    font_size = 10
    gaps_in = 3
    gaps_out = 3

    col.active = $groupbar_active
    col.inactive = $groupbar_inactive
    col.locked_active = $groupbar_locked_active
    col.locked_inactive = $groupbar_locked_inactive
}

animations {
    enabled = true

    bezier = water, 0.22, 0.9, 0.36, 1.0
    bezier = flow, 0.25, 0.1, 0.25, 1.0       
    bezier = ripple, 0.33, 0.0, 0.2, 1.0
    bezier = stream, 0.4, 0.0, 0.4, 1.0       
    bezier = cascade, 0.19, 1.0, 0.22, 1.0

    animation = windows,    1, 3.0, water           
    animation = windowsIn,  1, 2.8, cascade
    animation = windowsOut, 1, 2.4, stream
    animation = windowsMove,1,  1.6, flow             
    animation = fade,       1, 2.4, water
    animation = fadeIn,     1, 2.0, cascade
    animation = fadeOut,    1, 1.8, ripple
    animation = fadeDim,    1, 2.0, water
    animation = fadeSwitch, 1,  1.4, flow              
    animation = layers,     1, 2.6, water, slide
    animation = layersIn,   1, 2.4, cascade, slide
    animation = layersOut,  1, 1.9, stream, slide
    animation = workspaces, 1, 2.8, flow
    animation = specialWorkspace, 1, 2.5, water
    animation = border,     1, 2.9, water
    animation = borderangle,1, 3.5, flow
}

decoration {
    motion_blur {
        enabled = true
    }

    shadow {
        enabled = true
        range = 16
        color = rgba(00000052)
    }

    blur {
        enabled = true
        size = 10
        passes = 2
        new_optimizations = true
    }

    dim_inactive = true
    dim_strength = 0.5
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
}

#misc {
  #  background_color = $background 
#}

layerrule = blur, walker
layerrule = ignorealpha 0, walker

layerrule = blur, waybar
layerrule = ignorealpha 0.1, waybar

layerrule = blur, notifications
layerrule = ignorealpha 0.1, notifications

layerrule = blur, swayosd
layerrule = ignorezero 0.1, swayosd
