# Override de [lock]. selection (tinte de seleccion del input) mantiene el
# acento claro de hielo.
background       = "#0e1114"
background-alpha = 0.8
text             = "#e4edf2"
placeholder      = "#9ba2a7"
text-error       = "#277789"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#277789"
border-alpha     = 1.0
selection        = "#6bcee5"
selection-alpha  = 0.45